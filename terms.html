    try {
      const savedLang = localStorage.getItem('compressor_lang');
      if (savedLang === 'en' || (savedLang === null && !navigator.language.startsWith('es'))) {
        currentLang = 'en';
      }
    } catch(e) {}

    function renderContent() {
      const data = contentData[currentLang];
      document.documentElement.lang = currentLang;
      document.title = (currentLang === 'es' ? 'Términos de Uso' : 'Terms of Service') + ' — Compressor';
      document.getElementById('langLabel').textContent = currentLang === 'es' ? 'EN' : 'ES';
      
      const doc = document.getElementById('docContent');
      doc.innerHTML = `
        <div class="badge">${data.badge}</div>
        <h1>${data.title}</h1>
        <div class="last-updated">${data.updated}</div>
        ${data.html}
      `;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (data[key]) el.textContent = data[key];
      });
    }

    document.getElementById('langToggle').addEventListener('click', () => {
      currentLang = currentLang === 'es' ? 'en' : 'es';
      try { localStorage.setItem('compressor_lang', currentLang); } catch(e) {}
      renderContent();
    });

    document.getElementById('themeToggle').addEventListener('click', () => {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      if (isLight) {
        document.documentElement.removeAttribute('data-theme');
        try { localStorage.setItem('compressor_theme', 'dark'); } catch(e) {}
      } else {
        document.documentElement.setAttribute('data-theme', 'light');

    });
