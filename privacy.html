<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Política de Privacidad — Compressor para macOS</title>
  <meta name="description" content="Privacidad de Compressor para macOS: procesamiento local de archivos, preferencias guardadas en el dispositivo y servicios externos del sitio web.">
  <link rel="icon" type="image/svg+xml" href="assets/app_icon.svg">
  <link rel="apple-touch-icon" href="assets/app_icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    (function() {
      try {
        if (localStorage.getItem('compressor_theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
  <style>
    :root {
      --bg: #090a0f;
      --bg-card: rgba(22, 24, 34, 0.72);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      --accent: #2563eb;
      --accent-glow: rgba(37, 99, 235, 0.4);
      --nav-bg: rgba(9, 10, 15, 0.85);
      --radius-lg: 24px;
      --radius-md: 16px;
    }
    [data-theme="light"] {
      --bg: #ffffff;
      --bg-card: rgba(255, 255, 255, 0.95);
      --border: rgba(0, 0, 0, 0.08);
      --text: #0f172a;
      --text-muted: #475569;
      --text-dim: #64748b;
      --accent: #2563eb;
      --accent-glow: rgba(37, 99, 235, 0.15);
      --nav-bg: rgba(255, 255, 255, 0.9);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .container { max-width: 860px; margin: 0 auto; padding: 0 24px; width: 100%; }
    header.site-nav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--nav-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 16px 0;
    }
    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 1.15rem;
    }
    .brand img { width: 34px; height: 34px; border-radius: 8px; }
    .nav-actions { display: flex; align-items: center; gap: 12px; }
    .btn-back {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      transition: all 0.2s ease;
    }
    .btn-back:hover { color: var(--text); border-color: var(--text-muted); }
    .lang-btn, .theme-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .lang-btn:hover, .theme-btn:hover { color: var(--text); border-color: var(--text-muted); }
    main { flex: 1; padding: 60px 0 80px; }
    .doc-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 48px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 100px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #10b981;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 20px;
    }
    h1 { font-size: 2.3rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 12px; line-height: 1.2; }
    .last-updated { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 36px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
    h2 { font-size: 1.35rem; font-weight: 700; margin: 32px 0 12px; letter-spacing: -0.02em; color: var(--text); }
    p, ul { color: var(--text-muted); font-size: 1rem; margin-bottom: 16px; }
    ul { padding-left: 24px; }
    li { margin-bottom: 8px; }
    strong { color: var(--text); }
    .highlight-box {
      background: rgba(37, 99, 235, 0.08);
      border-left: 4px solid var(--accent);
      padding: 18px 22px;
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      margin: 28px 0;
    }
    .highlight-box p { color: var(--text); margin-bottom: 0; font-weight: 500; }
    footer {
      border-top: 1px solid var(--border);
      padding: 30px 0;
      text-align: center;
      color: var(--text-dim);
      font-size: 0.9rem;
    }
    footer a { color: var(--text-muted); text-decoration: none; margin: 0 8px; }
    footer a:hover { color: var(--text); }
    @media (max-width: 640px) {
      .doc-card { padding: 28px 20px; }
      h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>
  <header class="site-nav">
    <div class="container nav-inner">
      <a href="index.html" class="brand">
        <img src="assets/app_icon.png" alt="Compressor Icon">
        <span>Compressor</span>
      </a>
      <div class="nav-actions">
        <a href="index.html" class="btn-back" data-i18n="nav_home">← Volver al inicio</a>
        <button id="langToggle" class="lang-btn" aria-label="Cambiar idioma">
          <span id="langLabel">EN</span>
        </button>
        <button id="themeToggle" class="theme-btn" aria-label="Cambiar tema">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <article class="doc-card" id="docContent">
      <!-- El contenido se inyecta dinámicamente según idioma -->
    </article>
  </main>

  <footer>
    <div class="container">
      <p>
        <a href="index.html" data-i18n="ftr_home">Inicio</a> •
        <a href="privacy.html" style="color:var(--text); font-weight:600;" data-i18n="ftr_priv">Privacidad</a> •
        <a href="terms.html" data-i18n="ftr_terms">Términos de uso</a> •
        <a href="https://github.com/infoprojectstone/compressor" target="_blank">GitHub</a>
      </p>
      <p style="margin-top:10px;">Compressor para macOS · Mantenido por Infoprojectstone · Código abierto bajo licencia MIT</p>
    </div>
  </footer>

  <script>
    const contentData = {
      es: {
        badge: "🔒 Procesamiento local",
        title: "Política de Privacidad",
        updated: "Última actualización: 24 de septiembre de 2026",
        html: `
          <div class="highlight-box">
            <p><strong>En resumen:</strong> La app procesa en tu Mac los archivos que eliges y no los carga a servidores del proyecto. La app no incorpora telemetría, analítica ni envío automático de informes de fallos. El sitio web sí carga fuentes de Google y está alojado en GitHub Pages; esos servicios pueden recibir datos técnicos de conexión cuando visitas la web.</p>
          </div>

          <h2>1. Alcance y contacto</h2>
          <p>Esta política describe la aplicación Compressor para macOS y el sitio web oficial del proyecto. El proyecto está mantenido por <strong>Infoprojectstone</strong>. Para consultas sobre la aplicación o esta política, puedes contactar mediante <a href="https://github.com/infoprojectstone/compressor/issues" target="_blank" rel="noopener noreferrer" style="color:var(--accent); font-weight:600;">GitHub Issues</a>. Ese espacio es público: no publiques allí datos personales, documentos, archivos privados ni información confidencial.</p>

          <h2>2. Archivos que procesas con la aplicación</h2>
          <p>Cuando seleccionas archivos o carpetas, Compressor lee localmente los elementos compatibles y los datos técnicos necesarios para procesarlos, como su formato, tamaño y, en el caso de vídeos, duración. El procesamiento se realiza en el Mac mediante frameworks de Apple. La aplicación no carga esos archivos ni sus metadatos a servidores del proyecto.</p>
          <ul>
            <li>La selección puede hacerse mediante arrastrar y soltar, el selector de archivos o la Acción Rápida de Finder. Al elegir una carpeta, la app busca dentro de ella archivos compatibles.</li>
            <li>Los archivos resultantes se guardan en la ubicación que elijas. La app procura conservar intactos los originales y crea nombres de salida únicos; revisa los resultados antes de borrar tus originales.</li>
            <li>Los datos de la cola de trabajo se usan mientras está abierta la sesión de la aplicación. Los archivos de salida que guardes permanecen en tu Mac hasta que los elimines.</li>
          </ul>

          <h2>3. Preferencias guardadas en el Mac</h2>
          <p>La app guarda localmente algunas preferencias en el almacenamiento de macOS, por ejemplo el idioma, la ubicación de salida elegida y un marcador de seguridad para la carpeta personalizada que selecciones. Se usan para recordar tus ajustes y permitir el acceso a esa carpeta. No se envían al proyecto.</p>

          <h2>4. Telemetría e informes de fallos</h2>
          <p>El código fuente revisado no contiene SDKs de analítica ni un mecanismo propio de telemetría o envío automático de informes de fallos. macOS puede ofrecer el envío de diagnósticos del sistema a Apple según los ajustes que hayas elegido en el dispositivo; esa función la controla Apple, no Compressor. Si envías voluntariamente un informe mediante GitHub, el contenido que publiques podrá ser visible para otras personas y se tratará conforme a las condiciones y la política de privacidad de GitHub.</p>

          <h2>5. Sitio web, fuentes y servicios externos</h2>
          <p>El sitio y las descargas se sirven mediante GitHub Pages y GitHub Releases. Al abrir las páginas, el navegador también solicita hojas de estilo y archivos de fuentes a Google Fonts (<code>fonts.googleapis.com</code> y <code>fonts.gstatic.com</code>). Esas solicitudes pueden comunicar a Google datos técnicos de conexión, como la dirección IP y datos del navegador. GitHub puede tratar datos técnicos de acceso, como la dirección IP y el agente de usuario, conforme a sus propias prácticas y a la <a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement" target="_blank" rel="noopener noreferrer">Declaración de Privacidad de GitHub</a>. Google trata las solicitudes conforme a su <a href="https://policies.google.com/privacy" target="_blank" rel="noopener noreferrer">Política de Privacidad</a>. El proyecto no controla los plazos de conservación ni los usos que esos proveedores hagan de los datos que reciban.</p>
          <p>El sitio guarda las preferencias de idioma y tema en el almacenamiento local (<code>localStorage</code>) de tu navegador. El código del sitio usa esas preferencias para recordar cómo mostrar las páginas. Puedes borrarlas desde la configuración de almacenamiento de tu navegador. Los enlaces a GitHub, Ko-fi u otros servicios externos se rigen por las políticas de esos servicios cuando los visitas.</p>

          <h2>6. Conservación y control</h2>
          <p>Los archivos procesados y los resultados permanecen en las ubicaciones de tu Mac hasta que tú los elimines. Las preferencias permanecen en el almacenamiento local de macOS mientras sigan guardadas allí. GitHub y Google tratan las solicitudes técnicas y los registros relacionados conforme a sus propias políticas; la aplicación Compressor no los recopila.</p>

          <h2>7. Cambios en esta política</h2>
          <p>Si cambian las funciones de la aplicación, el sitio o los servicios externos utilizados, actualizaremos esta página y su fecha. La versión publicada aquí es la vigente para el sitio.</p>

          <h2>8. Información de privacidad y derechos</h2>
          <p>Para los datos técnicos que tratan directamente GitHub o Google, consulta la <a href="https://docs.github.com/es/site-policy/privacy-policies/github-general-privacy-statement" target="_blank" rel="noopener noreferrer">Declaración de Privacidad de GitHub</a>, la <a href="https://policies.google.com/privacy?hl=es" target="_blank" rel="noopener noreferrer">Política de Privacidad de Google</a> y sus canales de privacidad. Para consultas sobre la aplicación, puedes escribir al proyecto mediante GitHub Issues. Los issues son públicos: no incluyas datos privados ni solicitudes que revelen información personal.</p>
        `,
        nav_home: "← Volver al inicio",
        ftr_home: "Inicio",
        ftr_priv: "Privacidad",
        ftr_terms: "Términos de uso"
      },
      en: {
        badge: "🔒 Local processing",
        title: "Privacy Policy",
        updated: "Last updated: September 24, 2026",
        html: `
          <div class="highlight-box">
            <p><strong>In brief:</strong> The app processes the files you choose on your Mac and does not upload them to project servers. The app does not include telemetry, analytics, or automatic crash reporting. The website is hosted on GitHub Pages and loads fonts from Google; those providers may receive technical connection data when you visit the site.</p>
          </div>

          <h2>1. Scope and contact</h2>
          <p>This policy covers the Compressor macOS app and the project's official website. The project is maintained by <strong>Infoprojectstone</strong>. For questions about the app or this policy, contact the project through <a href="https://github.com/infoprojectstone/compressor/issues" target="_blank" rel="noopener noreferrer" style="color:var(--accent); font-weight:600;">GitHub Issues</a>. Issues are public: do not post personal data, documents, private files, or confidential information there.</p>

          <h2>2. Files processed by the app</h2>
          <p>When you select files or folders, Compressor reads compatible items locally and uses the technical information needed to process them, such as file format, size, and video duration. Processing runs on your Mac using Apple frameworks. The app does not upload those files or their metadata to project servers.</p>
          <ul>
            <li>You can select items by drag and drop, the file picker, or the Finder Quick Action. When you choose a folder, the app searches it for supported files.</li>
            <li>Output files are saved to the location you choose. The app is designed to leave originals intact and create unique output names; review the results before deleting any originals.</li>
            <li>Queue data is used while the app session is open. Output files you save remain on your Mac until you delete them.</li>
          </ul>

          <h2>3. Preferences stored on your Mac</h2>
          <p>The app stores some preferences locally in macOS storage, such as your language, selected output location, and a security-scoped bookmark for a custom folder you choose. These settings are used to remember your choices and access that folder. They are not sent to the project.</p>

          <h2>4. Telemetry and crash reports</h2>
          <p>The source code reviewed contains no analytics SDK or app-run telemetry or automatic crash-reporting mechanism. macOS may offer to send system diagnostics to Apple depending on the settings you chose on your device; Apple controls that feature, not Compressor. If you voluntarily submit a report through GitHub, what you post may be visible to others and is handled under GitHub's terms and privacy policy.</p>

          <h2>5. Website, fonts, and external services</h2>
          <p>The website and downloads are served through GitHub Pages and GitHub Releases. When you open the pages, your browser also requests stylesheets and font files from Google Fonts (<code>fonts.googleapis.com</code> and <code>fonts.gstatic.com</code>). Those requests may disclose technical connection data to Google, such as your IP address and browser information. GitHub may process technical access data, such as IP addresses and user agents, under its own practices and policies. The project does not control how long those providers retain data or how they use data they receive.</p>
          <p>The site stores language and theme preferences in your browser's local storage (<code>localStorage</code>). The site code uses these preferences to remember how to display the pages. You can clear them in your browser's storage settings. Links to GitHub, Ko-fi, or other external services are governed by those services' policies when you visit them.</p>

          <h2>6. Retention and control</h2>
          <p>Processed files and outputs remain in the locations on your Mac until you delete them. Preferences remain in macOS local storage while they are stored there. GitHub and Google handle technical requests and any related records under their own policies; Compressor does not collect those records through the app.</p>

          <h2>7. Changes to this policy</h2>
          <p>If the app, website, or external services change, we will update this page and its date. The version published here is the current version for the website.</p>

          <h2>8. Privacy information and rights</h2>
          <p>For technical data processed directly by GitHub or Google, consult the <a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement" target="_blank" rel="noopener noreferrer">GitHub Privacy Statement</a>, the <a href="https://policies.google.com/privacy" target="_blank" rel="noopener noreferrer">Google Privacy Policy</a>, and their privacy channels. For questions about the app or information you posted in the repository, contact the project through GitHub; do not include private data in a public issue. The maintainer's published identity and contact details are the ones listed above.</p>
        `,
        nav_home: "← Back to Home",
        ftr_home: "Home",
        ftr_priv: "Privacy Policy",
        ftr_terms: "Terms of Use"
      }
    };

    let currentLang = 'es';
    try {
      const savedLang = localStorage.getItem('compressor_lang');
      if (savedLang === 'en' || (savedLang === null && !navigator.language.startsWith('es'))) {
        currentLang = 'en';
      }
    } catch(e) {}

    function renderContent() {
      const data = contentData[currentLang];
      document.documentElement.lang = currentLang;
      document.title = (currentLang === 'es' ? 'Política de Privacidad' : 'Privacy Policy') + ' — Compressor';
      document.getElementById('langLabel').textContent = currentLang === 'es' ? 'EN' : 'ES';
      
      const doc = document.getElementById('docContent');
      doc.innerHTML = `
        <div class="badge">${data.badge}</div>
        <h1>${data.title}</h1>
        <div class="last-updated">${data.updated}</div>
        ${data.html}
      `;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (data[key]) el.textContent = data[key];
      });
    }

    document.getElementById('langToggle').addEventListener('click', () => {
      currentLang = currentLang === 'es' ? 'en' : 'es';
      try { localStorage.setItem('compressor_lang', currentLang); } catch(e) {}
      renderContent();
    });

    document.getElementById('themeToggle').addEventListener('click', () => {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      if (isLight) {
        document.documentElement.removeAttribute('data-theme');
        try { localStorage.setItem('compressor_theme', 'dark'); } catch(e) {}
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        try { localStorage.setItem('compressor_theme', 'light'); } catch(e) {}
      }
    });

    renderContent();
  </script>
</body>
</html>
