<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Términos de Uso — Compressor para macOS</title>
  <meta name="description" content="Términos y condiciones de uso de Compressor para macOS. Software libre bajo licencia MIT.">
  <link rel="icon" type="image/svg+xml" href="assets/app_icon.svg">
  <link rel="apple-touch-icon" href="assets/app_icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    (function() {
      try {
        if (localStorage.getItem('compressor_theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
  <style>
    :root {
      --bg: #090a0f;
      --bg-card: rgba(22, 24, 34, 0.72);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      --accent: #2563eb;
      --accent-glow: rgba(37, 99, 235, 0.4);
      --nav-bg: rgba(9, 10, 15, 0.85);
      --radius-lg: 24px;
      --radius-md: 16px;
    }
    [data-theme="light"] {
      --bg: #ffffff;
      --bg-card: rgba(255, 255, 255, 0.95);
      --border: rgba(0, 0, 0, 0.08);
      --text: #0f172a;
      --text-muted: #475569;
      --text-dim: #64748b;
      --accent: #2563eb;
      --accent-glow: rgba(37, 99, 235, 0.15);
      --nav-bg: rgba(255, 255, 255, 0.9);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .container { max-width: 860px; margin: 0 auto; padding: 0 24px; width: 100%; }
    header.site-nav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--nav-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 16px 0;
    }
    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 1.15rem;
    }
    .brand img { width: 34px; height: 34px; border-radius: 8px; }
    .nav-actions { display: flex; align-items: center; gap: 12px; }
    .btn-back {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      transition: all 0.2s ease;
    }
    .btn-back:hover { color: var(--text); border-color: var(--text-muted); }
    .lang-btn, .theme-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .lang-btn:hover, .theme-btn:hover { color: var(--text); border-color: var(--text-muted); }
    main { flex: 1; padding: 60px 0 80px; }
    .doc-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 48px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 100px;
      background: rgba(37, 99, 235, 0.1);
      border: 1px solid rgba(37, 99, 235, 0.3);
      color: #3b82f6;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 20px;
    }
    h1 { font-size: 2.3rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 12px; line-height: 1.2; }
    .last-updated { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 36px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
    h2 { font-size: 1.35rem; font-weight: 700; margin: 32px 0 12px; letter-spacing: -0.02em; color: var(--text); }
    p, ul { color: var(--text-muted); font-size: 1rem; margin-bottom: 16px; }
    ul { padding-left: 24px; }
    li { margin-bottom: 8px; }
    strong { color: var(--text); }
    code { font-family: 'JetBrains Mono', monospace; font-size: 0.9em; background: rgba(255, 255, 255, 0.08); padding: 2px 6px; border-radius: 4px; }
    [data-theme="light"] code { background: rgba(0, 0, 0, 0.06); }
    .license-block {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: var(--radius-md);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin: 20px 0;
      white-space: pre-wrap;
      line-height: 1.5;
    }
    [data-theme="light"] .license-block { background: rgba(0, 0, 0, 0.03); }
    footer {
      border-top: 1px solid var(--border);
      padding: 30px 0;
      text-align: center;
      color: var(--text-dim);
      font-size: 0.9rem;
    }
    footer a { color: var(--text-muted); text-decoration: none; margin: 0 8px; }
    footer a:hover { color: var(--text); }
    @media (max-width: 640px) {
      .doc-card { padding: 28px 20px; }
      h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>
  <header class="site-nav">
    <div class="container nav-inner">
      <a href="index.html" class="brand">
        <img src="assets/app_icon.png" alt="Compressor Icon">
        <span>Compressor</span>
      </a>
      <div class="nav-actions">
        <a href="index.html" class="btn-back" data-i18n="nav_home">← Volver al inicio</a>
        <button id="langToggle" class="lang-btn" aria-label="Cambiar idioma">
          <span id="langLabel">EN</span>
        </button>
        <button id="themeToggle" class="theme-btn" aria-label="Cambiar tema">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>

      </div>
    </div>
  </header>

  <main class="container">

    </article>
  </main>

      }
    };

    let currentLang = 'es';
    try {
      const savedLang = localStorage.getItem('compressor_lang');
      if (savedLang === 'en' || (savedLang === null && !navigator.language.startsWith('es'))) {
        currentLang = 'en';
      }
    } catch(e) {}

    function renderContent() {
      const data = contentData[currentLang];
      document.documentElement.lang = currentLang;
      document.title = (currentLang === 'es' ? 'Términos de Uso' : 'Terms of Service') + ' — Compressor';
      document.getElementById('langLabel').textContent = currentLang === 'es' ? 'EN' : 'ES';
      
      const doc = document.getElementById('docContent');
      doc.innerHTML = `
        <div class="badge">${data.badge}</div>
        <h1>${data.title}</h1>
        <div class="last-updated">${data.updated}</div>
        ${data.html}
      `;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (data[key]) el.textContent = data[key];
      });
    }

    document.getElementById('langToggle').addEventListener('click', () => {
      currentLang = currentLang === 'es' ? 'en' : 'es';
      try { localStorage.setItem('compressor_lang', currentLang); } catch(e) {}
      renderContent();
    });

    document.getElementById('themeToggle').addEventListener('click', () => {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      if (isLight) {
        document.documentElement.removeAttribute('data-theme');
        try { localStorage.setItem('compressor_theme', 'dark'); } catch(e) {}
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        try { localStorage.setItem('compressor_theme', 'light'); } catch(e) {}
      }
    });

    renderContent();
  </script>
</body>
</html>
